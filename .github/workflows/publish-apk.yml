{"name": "Publish APK", "on": {"workflow_dispatch": {"inputs": {"apk_url": {"required": true, "type": "string"}, "tag": {"required": true, "type": "string"}}}}, "permissions": {"contents": "write"}, "jobs": {"publish": {"runs-on": "ubuntu-latest", "steps": [{"run": "curl -fL \"$APK_URL\" -o one-day-world.apk && ls -l one-day-world.apk && gh release create \"$TAG\" one-day-world.apk --repo \"$GITHUB_REPOSITORY\" --title \"One Day World $TAG\" --notes \"Direct sharing to X, WhatsApp, Instagram and Snapchat, share panel after posting, daily reminder when the wall clears, map fixes.\" --latest", "env": {"APK_URL": "${{ inputs.apk_url }}", "TAG": "${{ inputs.tag }}", "GH_TOKEN": "${{ github.token }}"}}]}}}
